name: 功能需求
description: 提出新功能或改善現有行為
title: "[需求] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提出前請先搜尋[既有的 issue](https://github.com/skydreamer0/tingzi/issues?q=is%3Aissue)，避免重複。較大的行為或結構變更，建議先在 issue 中討論規格。
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 目前的行為與限制，以及要解決的問題。
    validations:
      required: true
  - type: textarea
    id: requirement
    attributes:
      label: 需求
      description: 希望的行為。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代做法
      description: 選填。
  - type: textarea
    id: acceptance
    attributes:
      label: 驗收條件
      description: 可以觀察或檢查的結果，用來判斷需求是否完成。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 補充資料
      description: 選填。相關的 issue、規格、截圖或參考連結。
