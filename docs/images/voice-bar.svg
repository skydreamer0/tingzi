<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="t d" font-family="'Segoe UI','Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">
  <title id="t">語音浮條的組成與狀態</title>
  <desc id="d">浮條由麥克風按鈕、狀態文字、下一句使用的辨識引擎與麥克風、設定鍵和收合鍵組成，下方列出收合、錄音中、辨識中、完成與換欄五種狀態。</desc>
  <rect width="960" height="360" rx="18" fill="#F6F7FF"/>
  <g font-size="14" fill="#1F2455">
    <text x="32" y="42" font-size="18" font-weight="700">語音浮條</text>
    <!-- anatomy -->
    <rect x="250" y="64" width="460" height="64" rx="32" fill="#FFFFFF" stroke="#303897" stroke-width="1.5"/>
    <circle cx="286" cy="96" r="20" fill="#EEF0FB"/>
    <rect x="281" y="84" width="10" height="16" rx="5" fill="#303897"/>
    <path d="M275 96a11 11 0 0 0 22 0M286 107v6" fill="none" stroke="#303897" stroke-width="2.4" stroke-linecap="round"/>
    <text x="322" y="90" font-size="16" font-weight="700">聽字・中文</text>
    <text x="322" y="112" font-size="13" fill="#4A4F80">下次 線上辨識 · 你選的麥克風</text>
    <path d="M628 88h22M628 96h22M628 104h22" stroke="#303897" stroke-width="2" stroke-linecap="round"/>
    <circle cx="634" cy="88" r="3" fill="#FFFFFF" stroke="#303897" stroke-width="2"/><circle cx="644" cy="104" r="3" fill="#FFFFFF" stroke="#303897" stroke-width="2"/>
    <path d="M674 88l14 16M688 88l-14 16" stroke="#303897" stroke-width="2" stroke-linecap="round"/>
    <g font-size="13" fill="#4A4F80" stroke="#8A90C4" stroke-width="1">
      <path d="M286 122v26" fill="none"/><path d="M400 122v26" fill="none"/><path d="M639 122v26" fill="none"/><path d="M681 122v46" fill="none"/>
    </g>
    <g font-size="13" fill="#1F2455">
      <text x="286" y="164" text-anchor="middle">點一下錄音／停止</text>
      <text x="400" y="164" text-anchor="middle">目前狀態，以及下一句</text>
      <text x="400" y="182" text-anchor="middle">會用的引擎和麥克風</text>
      <text x="610" y="164" text-anchor="middle">設定</text>
      <text x="700" y="184" text-anchor="middle">收合成右側麥克風</text>
    </g>
    <!-- states -->
    <text x="32" y="226" font-size="16" font-weight="700">五種狀態</text>
    <g transform="translate(32,244)" font-size="13">
      <g>
        <rect width="168" height="92" rx="12" fill="#FFFFFF" stroke="#C9CEF5"/>
        <circle cx="26" cy="28" r="13" fill="#303897"/><rect x="22.500" y="20" width="7" height="11" rx="3.500" fill="#FFFFFF"/>
        <text x="48" y="33" font-weight="700" font-size="14">收合</text>
        <text x="14" y="60">只剩右側麥克風，</text><text x="14" y="78">隨時可以開始。</text>
      </g>
      <g transform="translate(182,0)">
        <rect width="168" height="92" rx="12" fill="#FFFFFF" stroke="#C9CEF5"/>
        <circle cx="26" cy="28" r="13" fill="#C0392B"/><rect x="21" y="23" width="10" height="10" rx="2" fill="#FFFFFF"/>
        <text x="48" y="33" font-weight="700" font-size="14">錄音中</text>
        <text x="14" y="60">顯示收音音量，</text><text x="14" y="78">再點一次停止。</text>
      </g>
      <g transform="translate(364,0)">
        <rect width="168" height="92" rx="12" fill="#FFFFFF" stroke="#C9CEF5"/>
        <circle cx="26" cy="28" r="13" fill="none" stroke="#303897" stroke-width="3" stroke-dasharray="52 30"/>
        <text x="48" y="33" font-weight="700" font-size="14">辨識中</text>
        <text x="14" y="60">標示這一句正在用</text><text x="14" y="78">線上或本機引擎。</text>
      </g>
      <g transform="translate(546,0)">
        <rect width="168" height="92" rx="12" fill="#FFFFFF" stroke="#C9CEF5"/>
        <circle cx="26" cy="28" r="13" fill="#2E8B57"/><path d="M20 28l4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="48" y="33" font-weight="700" font-size="14">完成</text>
        <text x="14" y="60">文字已插入原欄位，</text><text x="14" y="78">也複製到剪貼簿。</text>
      </g>
      <g transform="translate(728,0)">
        <rect width="168" height="92" rx="12" fill="#FFFFFF" stroke="#C9CEF5"/>
        <circle cx="26" cy="28" r="13" fill="#D98A00"/><path d="M26 20v10M26 34v2" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
        <text x="48" y="33" font-weight="700" font-size="14">換了欄位</text>
        <text x="14" y="60">不自動插入，展開</text><text x="14" y="78">預覽讓你自己貼上。</text>
      </g>
    </g>
  </g>
</svg>
