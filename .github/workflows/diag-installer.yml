name: Diagnose installer unpack (temporary)

on:
  push:
    branches: [claude/project-thread-beiiaz]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-latest, windows-latest, windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Machine
        run: |
          "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          cmd /c ver
          git --version
          "pwsh $($PSVersionTable.PSVersion)"
          powershell.exe -NoProfile -Command '"WinPS " + $PSVersionTable.PSVersion'
          python --version
          "TEMP=$env:TEMP"
          "PSModulePath=$env:PSModulePath"
          "PATHEXT=$env:PATHEXT"
          fsutil 8dot3name query C:
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) { "ISCC " + (Get-Item $iscc).VersionInfo.ProductVersion } else { 'no ISCC' }
          Get-MpComputerStatus -ErrorAction SilentlyContinue | Select-Object RealTimeProtectionEnabled, AntivirusEnabled | Format-List
      - name: Unpack and run the way the installer does
        run: |
          $ErrorActionPreference = 'Continue'
          $work = Join-Path $env:TEMP 'is-PROBE.tmp'
          New-Item -ItemType Directory -Force $work | Out-Null
          $src = Join-Path $env:RUNNER_TEMP 'src'
          New-Item -ItemType Directory -Force "$src\TingziFloat" | Out-Null
          Set-Content "$src\InstallTingzi.cmd" "@echo off`r`necho ran from %~dp0`r`nexit /b 42" -Encoding ascii
          Set-Content "$src\TingziFloat\LICENSE" 'x'
          python -c "import sys,zipfile,pathlib; s=pathlib.Path(sys.argv[1]); z=zipfile.ZipFile(sys.argv[2],'w',zipfile.ZIP_DEFLATED); [z.write(p, p.relative_to(s).as_posix()) for p in s.rglob('*') if p.is_file()]; z.close()" $src "$work\payload.zip"
          function Try($name, $lines) {
            Write-Host "===== $name"
            $bat = Join-Path $env:RUNNER_TEMP "$name.cmd"
            Set-Content $bat (@('@echo off') + $lines) -Encoding ascii
            $p = Start-Process cmd.exe -ArgumentList '/c', "`"$bat`"" -Wait -PassThru -NoNewWindow
            Write-Host "exit $($p.ExitCode)"
          }
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          foreach ($case in 'A', 'B', 'C') {
            $dest = "$work\payload$case"
            $lines = @()
            if ($case -eq 'B') { $lines += 'set PSModulePath=' }
            if ($case -eq 'C') {
              $lines += "mkdir `"$dest`""
              $lines += "`"%SystemRoot%\System32\tar.exe`" -xf `"$work\payload.zip`" -C `"$dest`""
            } else {
              $lines += "`"$ps`" -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command `"Expand-Archive -LiteralPath '$work\payload.zip' -DestinationPath '$dest' -Force; (Get-Command Expand-Archive).Module | Format-List Name,Version,Path`""
            }
            $lines += 'echo unpack exit %errorlevel%'
            $lines += "dir /s /b `"$dest`""
            $lines += "`"%SystemRoot%\System32\cmd.exe`" /c `"`"$dest\InstallTingzi.cmd`" /quiet > `"$work\out$case.txt`" 2>&1`""
            $lines += 'echo script exit %errorlevel%'
            $lines += "type `"$work\out$case.txt`""
            Try "case$case" $lines
          }
