<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聽字</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6C5 4.9 5.9 4 7 4H15"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20L8 19L19 8L16 5L5 16Z"/><path d="M14 7L17 10"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7H19M9 7V4H15V7M7 7L8 20H16L17 7M10 11V16M14 11V16"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7H6M12 7H20M4 12H12M18 12H20M4 17H7M13 17H20"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
    <symbol id="i-dock" viewBox="0 0 24 24"><path d="M9 6L15 12L9 18M20 5V19"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12L10 17L19 7"/></symbol>
    <symbol id="i-convert" viewBox="0 0 24 24"><path d="M4 8H17M14 5L17 8L14 11M20 16H7M10 13L7 16L10 19"/></symbol>
  </svg>

  <main class="capsule" data-state="idle" data-layout="docked" data-side="right" data-above="false">
    <div class="bar" data-tauri-drag-region>
      <button id="mic" class="mic" type="button" aria-label="開始錄音" aria-pressed="false">
        <!-- The mark inline (same shapes as mark.svg) so each part can show the state. -->
        <svg class="key" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect class="key-base" x="2" y="6" width="60" height="53" rx="13"/>
          <g class="key-face">
            <rect class="key-top" x="3.75" y="7.75" width="56.5" height="46" rx="11"/>
            <g class="key-ink">
              <path class="key-bar b4" stroke-width="4" d="M46 15v29"/>
              <path stroke-width="3" d="M17 21h29"/>
              <path stroke-width="4" d="M12 38h34"/>
              <path class="key-bar b3" stroke-width="3.5" d="M36 21v17"/>
              <path class="key-bar b2" stroke-width="3.5" d="M27 21v17"/>
              <path class="key-bar b1" stroke-width="4" d="M18 17l-2 25"/>
            </g>
          </g>
        </svg>
        <span class="done-badge"><svg class="glyph"><use href="#i-check"/></svg></span>
      </button>
      <div class="body" data-tauri-drag-region>
        <p id="detail" class="detail" data-tauri-drag-region></p>
        <p id="status" class="status" role="status" aria-live="polite" data-tauri-drag-region>點圖示開始錄音</p>
        <div class="meter" aria-hidden="true"><span id="level"></span></div>
      </div>
      <div class="tools">
        <button id="copy" class="tool for-text" type="button" title="複製辨識文字" aria-label="複製辨識文字"><svg class="glyph"><use href="#i-copy"/></svg></button>
        <button id="edit" class="tool for-text" type="button" title="編輯辨識文字" aria-label="編輯辨識文字"><svg class="glyph"><use href="#i-edit"/></svg></button>
        <button id="discard" class="tool for-retry" type="button" title="捨棄這段錄音" aria-label="捨棄這段錄音"><svg class="glyph"><use href="#i-trash"/></svg></button>
        <button id="convert" class="tool" type="button" title="剪貼簿文字簡繁互轉" aria-label="剪貼簿文字簡繁互轉"><svg class="glyph"><use href="#i-convert"/></svg></button>
        <button id="settings" class="tool" type="button" title="開啟設定" aria-label="開啟設定"><svg class="glyph"><use href="#i-settings"/></svg></button>
        <button id="dock" class="tool" type="button" title="收合成圖示" aria-label="收合成圖示"><svg class="glyph"><use href="#i-dock"/></svg></button>
      </div>
    </div>
    <div id="streaming-preview" class="streaming-preview" aria-label="即時辨識預覽" aria-live="polite" hidden></div>
    <section class="editor" aria-label="辨識文字">
      <textarea id="text" spellcheck="false" aria-label="辨識文字，可以修改"></textarea>
      <div class="actions">
        <select id="history" aria-label="最近的辨識紀錄"><option value="">最近紀錄…</option></select>
        <span class="hint" id="paste-last-hint">Alt+Shift+Z 再貼上一則</span>
        <button id="copy-all" class="primary" type="button">複製</button>
        <button id="collapse" class="plain" type="button">收起</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
