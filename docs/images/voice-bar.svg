<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d" font-family="'Segoe UI','Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">
  <title id="t">語音浮條的組成與狀態</title>
  <desc id="d">浮條由橫耳鍵圖示和從它長出來的膠囊組成，膠囊顯示狀態或辨識出的文字，滑鼠移上去時出現簡繁互轉、設定與收合鍵；換了欄位時膠囊旁會出現編輯卡。下方列出平常、錄音、辨識、潤稿（開啟 AI 潤稿時）、完成、換了欄位或辨識失敗六種狀態。</desc>
  <defs>
    <!-- The face of the keycap mark; each use draws its own base underneath so the base can show the state. -->
    <g id="face">
      <rect x="3.75" y="7.75" width="56.5" height="46" rx="11" fill="#E4E8FF"/>
      <g fill="none" stroke="#303897" stroke-linecap="round" stroke-linejoin="round">
        <path stroke-width="4" d="M46 15v29"/>
        <path stroke-width="3" d="M17 21h29"/>
        <path stroke-width="4" d="M12 38h34"/>
        <path stroke-width="3.5" d="M36 21v17"/>
        <path stroke-width="3.5" d="M27 21v17"/>
        <path stroke-width="4" d="M18 17l-2 25"/>
      </g>
    </g>
  </defs>
  <rect width="960" height="400" rx="18" fill="#F3F5FC"/>
  <g font-size="14" fill="#1F2455">
    <!-- anatomy: keycap and pill -->
    <text x="32" y="42" font-size="18" font-weight="700">語音浮條</text>
    <rect x="32" y="66" width="428" height="56" rx="28" fill="#E4E5F2" stroke="#C1C3E0"/>
    <g fill="none" stroke="#545A80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(54,82)"><path d="M4 8H17M14 5L17 8L14 11M20 16H7M10 13L7 16L10 19"/></g>
      <g transform="translate(90,82)"><path d="M4 7H6M12 7H20M4 12H12M18 12H20M4 17H7M13 17H20"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="10" cy="17" r="2"/></g>
      <g transform="translate(126,82)"><path d="M9 6L15 12L9 18M20 5V19"/></g>
    </g>
    <text x="382" y="99" font-size="14" fill="#545A80" text-anchor="end">按 Ctrl+Alt+R 或點圖示開始錄音</text>
    <g transform="translate(392,60) scale(1.0625)"><rect x="2" y="6" width="60" height="53" rx="13" fill="#303897"/><use href="#face"/></g>
    <g fill="none" stroke="#8A90C4" stroke-width="1">
      <path d="M102 128v20"/><path d="M276 128v20"/><path d="M426 132v16"/>
    </g>
    <g font-size="13">
      <text x="102" y="166" text-anchor="middle">滑鼠移上來才出現：</text>
      <text x="102" y="184" text-anchor="middle">簡繁互轉、設定、收合</text>
      <text x="276" y="166" text-anchor="middle">目前狀態，</text>
      <text x="276" y="184" text-anchor="middle">或剛辨識出的文字</text>
      <text x="426" y="166" text-anchor="middle">點一下錄音／停止</text>
      <text x="426" y="184" text-anchor="middle">按住可拖到另一側</text>
    </g>
    <!-- the editor card beside the pill -->
    <text x="520" y="42" font-size="18" font-weight="700">換了欄位時的編輯卡</text>
    <rect x="600" y="64" width="328" height="44" rx="22" fill="#E4E5F2" stroke="#C1C3E0"/>
    <text x="862" y="91" font-size="13" text-anchor="end">已複製文字・可手動貼上</text>
    <g transform="translate(872,56) scale(0.875)"><rect x="2" y="6" width="60" height="53" rx="13" fill="#303897"/><use href="#face"/></g>
    <rect x="520" y="120" width="408" height="94" rx="16" fill="#FFFFFF" stroke="#C1C3E0"/>
    <rect x="532" y="132" width="384" height="36" rx="10" fill="#F5F6FD" stroke="#BEC4E4"/>
    <text x="544" y="155" font-size="14">明天早上九點開會</text>
    <rect x="532" y="176" width="116" height="28" rx="10" fill="#F5F6FD" stroke="#BEC4E4"/>
    <text x="542" y="195" font-size="12">最近紀錄…</text>
    <path d="M630 187l4 4 4-4" fill="none" stroke="#545A80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="658" y="195" font-size="11" fill="#545A80">Alt+Shift+Z 再貼上一則</text>
    <rect x="800" y="176" width="56" height="28" rx="10" fill="#303897"/>
    <text x="828" y="195" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">複製</text>
    <rect x="864" y="176" width="52" height="28" rx="10" fill="none" stroke="#BEC4E4"/>
    <text x="890" y="195" font-size="12" text-anchor="middle">收起</text>
    <!-- states -->
    <text x="32" y="250" font-size="16" font-weight="700">六種狀態</text>
    <g transform="translate(32,266)" font-size="13">
      <g>
        <rect width="140" height="112" rx="12" fill="#FFFFFF" stroke="#BEC4E4"/>
        <g transform="translate(98,9) scale(0.5)"><rect x="2" y="6" width="60" height="53" rx="13" fill="#303897"/><use href="#face"/></g>
        <text x="14" y="64" font-weight="700" font-size="14">平常</text>
        <text x="14" y="84">只剩邊緣橫耳鍵，</text><text x="14" y="102">隨時可以開始。</text>
      </g>
      <g transform="translate(151.2,0)">
        <rect width="140" height="112" rx="12" fill="#FFFFFF" stroke="#BEC4E4"/>
        <rect x="10" y="14" width="120" height="24" rx="12" fill="#E4E5F2" stroke="#C1C3E0"/>
        <text x="92" y="27" font-size="10.500" text-anchor="end">錄音中 00:05</text>
        <rect x="18" y="31.500" width="74" height="2.500" rx="1.250" fill="#BEC4E4"/><rect x="18" y="31.500" width="45" height="2.500" rx="1.250" fill="#303897"/>
        <g transform="translate(98,9) scale(0.5)"><rect x="2" y="6" width="60" height="53" rx="13" fill="#D63A37"/><use href="#face"/></g>
        <text x="14" y="64" font-weight="700" font-size="14">錄音</text>
        <text x="14" y="84">鍵帽底變紅，</text><text x="14" y="102">再點一次停止。</text>
      </g>
      <g transform="translate(302.4,0)">
        <rect width="140" height="112" rx="12" fill="#FFFFFF" stroke="#BEC4E4"/>
        <rect x="10" y="14" width="120" height="24" rx="12" fill="#E4E5F2" stroke="#C1C3E0"/>
        <text x="92" y="30" font-size="10.500" fill="#545A80" text-anchor="end">線上辨識中</text>
        <g transform="translate(98,9) scale(0.5)"><rect x="2" y="6" width="60" height="53" rx="13" fill="#303897"/><use href="#face"/></g>
        <text x="14" y="64" font-weight="700" font-size="14">辨識</text>
        <text x="14" y="84">標示用的是線上</text><text x="14" y="102">或本機引擎。</text>
      </g>
      <g transform="translate(453.6,0)">
        <rect width="140" height="112" rx="12" fill="#FFFFFF" stroke="#BEC4E4"/>
        <rect x="10" y="14" width="120" height="24" rx="12" fill="#E4E5F2" stroke="#C1C3E0"/>
        <text x="92" y="30" font-size="10.500" fill="#545A80" text-anchor="end">潤稿中</text>
        <g transform="translate(98,9) scale(0.5)"><rect x="2" y="6" width="60" height="53" rx="13" fill="#303897"/><use href="#face"/></g>
        <text x="14" y="64" font-weight="700" font-size="14">潤稿</text>
        <text x="14" y="84">開了 AI 潤稿才有，</text><text x="14" y="102">再點一下取消。</text>
      </g>
      <g transform="translate(604.8,0)">
        <rect width="140" height="112" rx="12" fill="#FFFFFF" stroke="#BEC4E4"/>
        <rect x="10" y="14" width="120" height="24" rx="12" fill="#E4E5F2" stroke="#C1C3E0"/>
        <text x="92" y="30" font-size="10.500" text-anchor="end">明天早上九點開會</text>
        <g transform="translate(98,9) scale(0.5)"><rect x="2" y="6" width="60" height="53" rx="13" fill="#303897"/><use href="#face"/></g>
        <text x="14" y="64" font-weight="700" font-size="14">完成</text>
        <text x="14" y="84">文字已插入並複製</text><text x="14" y="102">幾秒後縮回鍵帽。</text>
      </g>
      <g transform="translate(756.0,0)">
        <rect width="140" height="112" rx="12" fill="#FFFFFF" stroke="#BEC4E4"/>
        <rect x="10" y="14" width="120" height="24" rx="12" fill="#E4E5F2" stroke="#C1C3E0"/>
        <text x="92" y="30" font-size="10.500" fill="#B0281E" text-anchor="end">線上辨識失敗</text>
        <g transform="translate(98,9) scale(0.5)"><rect x="2" y="6" width="60" height="53" rx="13" fill="#943A5D"/><use href="#face"/></g>
        <text x="14" y="64" font-weight="700" font-size="14">換了欄位或失敗</text>
        <text x="14" y="84">留著文字或原因，</text><text x="14" y="102">不會自動貼上。</text>
      </g>
    </g>
  </g>
</svg>
