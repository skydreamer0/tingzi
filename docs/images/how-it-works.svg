<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="t d" font-family="'Segoe UI','Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">
  <title id="t">聽字的三個步驟</title>
  <desc id="d">第一步點右側麥克風說話，第二步文字插入游標所在位置，第三步用注音重新選同音字。</desc>
  <rect width="960" height="330" rx="18" fill="#F6F7FF"/>
  <g font-size="15" fill="#1F2455">
    <!-- step 1 -->
    <g transform="translate(24,24)">
      <rect width="288" height="282" rx="14" fill="#FFFFFF" stroke="#C9CEF5"/>
      <circle cx="30" cy="32" r="14" fill="#303897"/><text x="30" y="37" text-anchor="middle" fill="#FFFFFF" font-weight="700">1</text>
      <text x="54" y="37" font-weight="700" font-size="17">點麥克風，開始說</text>
      <rect x="22" y="62" width="244" height="150" rx="8" fill="#EEF0FB" stroke="#C9CEF5"/>
      <rect x="22" y="62" width="244" height="22" rx="8" fill="#DCE0F7"/>
      <text x="34" y="78" font-size="12" fill="#4A4F80">記事本</text>
      <rect x="36" y="100" width="2" height="18" fill="#303897"/>
      <text x="44" y="114" font-size="13" fill="#7A7FA8">游標放在要打字的地方</text>
      <circle cx="244" cy="160" r="20" fill="#303897"/>
      <rect x="239" y="148" width="10" height="16" rx="5" fill="#FFFFFF"/>
      <path d="M233 160a11 11 0 0 0 22 0M244 171v6" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
      <text x="22" y="240" font-size="14">螢幕右側常駐一顆麥克風。</text>
      <text x="22" y="262" font-size="14">點一下開始，再點一下停止。</text>
    </g>
    <!-- step 2 -->
    <g transform="translate(336,24)">
      <rect width="288" height="282" rx="14" fill="#FFFFFF" stroke="#C9CEF5"/>
      <circle cx="30" cy="32" r="14" fill="#303897"/><text x="30" y="37" text-anchor="middle" fill="#FFFFFF" font-weight="700">2</text>
      <text x="54" y="37" font-weight="700" font-size="17">說完，文字就插入</text>
      <rect x="22" y="62" width="244" height="150" rx="8" fill="#EEF0FB" stroke="#C9CEF5"/>
      <rect x="22" y="62" width="244" height="22" rx="8" fill="#DCE0F7"/>
      <text x="34" y="78" font-size="12" fill="#4A4F80">記事本</text>
      <text x="36" y="116" font-size="16" fill="#1F2455">明天早上九點開會</text>
      <rect x="166" y="100" width="2" height="20" fill="#303897"/>
      <rect x="36" y="160" width="216" height="36" rx="18" fill="#FFFFFF" stroke="#303897"/>
      <circle cx="56" cy="178" r="9" fill="#2E8B57"/>
      <path d="M51 178l4 4 7-8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="183" font-size="13">已插入並複製到剪貼簿</text>
      <text x="22" y="240" font-size="14">游標還在原欄位時只插入一次；</text>
      <text x="22" y="262" font-size="14">換了欄位則留在預覽，由你貼上。</text>
    </g>
    <!-- step 3 -->
    <g transform="translate(648,24)">
      <rect width="288" height="282" rx="14" fill="#FFFFFF" stroke="#C9CEF5"/>
      <circle cx="30" cy="32" r="14" fill="#303897"/><text x="30" y="37" text-anchor="middle" fill="#FFFFFF" font-weight="700">3</text>
      <text x="54" y="37" font-weight="700" font-size="17">同音字，用注音改</text>
      <rect x="22" y="62" width="244" height="150" rx="8" fill="#EEF0FB" stroke="#C9CEF5"/>
      <rect x="22" y="62" width="244" height="22" rx="8" fill="#DCE0F7"/>
      <text x="34" y="78" font-size="12" fill="#4A4F80">記事本</text>
      <text x="36" y="116" font-size="16" fill="#1F2455">我很想</text>
      <rect x="86" y="98" width="42" height="24" rx="4" fill="#D7F2EF"/>
      <text x="90" y="116" font-size="16" fill="#12716F">ㄋㄧˇ</text>
      <rect x="36" y="134" width="170" height="64" rx="8" fill="#FFFFFF" stroke="#303897"/>
      <text x="48" y="154" font-size="12" fill="#4A4F80">注音選字　1/3</text>
      <text x="48" y="184" font-size="17">1 你</text>
      <rect x="100" y="165" width="56" height="26" rx="5" fill="#303897"/>
      <text x="108" y="184" font-size="17" fill="#FFFFFF">2 妳</text>
      <text x="22" y="240" font-size="14">按 Win＋空白鍵切到聽字，</text>
      <text x="22" y="262" font-size="14">打注音、按 ↓ 選字，Enter 送出。</text>
    </g>
  </g>
</svg>
