[package]
name = "tingzi-app"
version = "0.8.0"
edition = "2021"
rust-version = "1.82"
description = "Tingzi voice window: record, recognise and insert Traditional Chinese text"
license = "MIT"
publish = false

[[bin]]
name = "Tingzi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Transparent windows on macOS need the private API; the feature does nothing on Windows.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
codex-asr = { version = "0.1.2", default-features = false }
# The same build codex-asr already uses, so no new crates are compiled.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
# Already built for the crates above; checks downloaded models.
sha2 = "0.10"
cpal = "0.15"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSPasteboard", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }
core-foundation = "0.10"
libc = "0.2"
rfd = { version = "0.15", default-features = false }
security-framework = "3"

# Link-time optimisation crashed the compiler on this project, so release builds go without it.
[profile.release]
strip = true
