[package]
name = "tingzi-app"
version = "0.7.3"
edition = "2021"
rust-version = "1.82"
description = "Tingzi voice window: record, recognise and insert Traditional Chinese text"
license = "MIT"
publish = false

[[bin]]
name = "Tingzi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
codex-asr = { version = "0.1.2", default-features = false }
cpal = "0.15"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Link-time optimisation crashed the compiler on this project, so release builds go without it.
[profile.release]
strip = true
